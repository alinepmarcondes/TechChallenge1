[project]
name = "techchallenge1"
version = "0.1.0"
description = "Pipeline de Machine Learning para previsão de churn de clientes"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "joblib>=1.5.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"